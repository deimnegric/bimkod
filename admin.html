<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BİMKOD — Onay Ekranı</title>
<style>
  :root{
    --bg:#FAF9F5; --surface:#FFFFFF; --border:#E8E4DA; --text:#2C2A26;
    --text-soft:#8A8578; --blue:#7FA8C9; --blue-dark:#5E85A3;
    --red:#D98A8A; --red-dark:#B96666; --green:#6FA37A;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:16px; max-width:720px; margin:0 auto;
  }
  h1{ font-size:18px; margin:0 0 4px; }
  p.sub{ color:var(--text-soft); font-size:13px; margin:0 0 16px; }

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px; margin-bottom:16px;
  }
  .row{ display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .row input{ flex:1; min-width:120px; }
  label{ font-size:12px; color:var(--text-soft); display:block; margin-bottom:3px; }
  input[type=text], input[type=password]{
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px;
    font-size:13.5px; background:var(--bg); color:var(--text);
  }
  button{
    padding:9px 14px; border:none; border-radius:8px; font-size:13.5px; font-weight:600;
    cursor:pointer;
  }
  .btn-primary{ background:var(--blue); color:#fff; }
  .btn-approve{ background:var(--green); color:#fff; }
  .btn-reject{ background:var(--red); color:#fff; }
  .btn-secondary{ background:var(--border); color:var(--text); }
  button:disabled{ opacity:.5; cursor:not-allowed; }

  #status{ font-size:13px; color:var(--blue-dark); min-height:18px; margin-bottom:8px; white-space:pre-wrap; }
  #counter{ font-size:13px; color:var(--text-soft); margin-bottom:12px; }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px; margin-bottom:10px; display:flex; gap:12px;
  }
  .card img{ width:90px; height:110px; object-fit:contain; border-radius:8px; background:var(--bg); flex-shrink:0; }
  .card-body{ flex:1; min-width:0; }
  .raw-ocr{
    font-family:ui-monospace,monospace; font-size:11px; color:var(--text-soft);
    background:var(--bg); padding:6px 8px; border-radius:6px; margin-bottom:8px;
    white-space:pre-wrap; max-height:70px; overflow-y:auto;
  }
  .field-row{ display:flex; gap:8px; margin-bottom:8px; }
  .field-row > div{ flex:1; }
  .card-actions{ display:flex; gap:8px; }
  .card.done{ opacity:.4; pointer-events:none; }

  #loadMore{ width:100%; margin-top:8px; }
  .hidden{ display:none !important; }
</style>
</head>
<body>

  <h1>BİMKOD — Onay Ekranı</h1>
  <p class="sub">OCR'ın kod/isim çıkaramadığı ürünleri burada elle düzeltip onaylayabilirsin. Onaylanan ürün anında canlı siteye eklenir.</p>

  <div class="panel" id="configPanel">
    <div class="row">
      <div style="flex:1">
        <label>GitHub kullanıcı/repo (owner/repo)</label>
        <input type="text" id="repoInput" value="deimnegric/bimkod">
      </div>
      <div style="flex:1">
        <label>Branch</label>
        <input type="text" id="branchInput" value="main">
      </div>
    </div>
    <div class="row">
      <div style="flex:1">
        <label>GitHub Personal Access Token (repo yazma izinli)</label>
        <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx">
      </div>
    </div>
    <div class="row" style="align-items:center;">
      <label style="display:flex; align-items:center; gap:6px; margin:0;">
        <input type="checkbox" id="rememberToken" style="width:auto;">
        Token'ı bu tarayıcıda hatırla (sadece bu bilgisayarda, paylaşmadığın sürece güvenli)
      </label>
    </div>
    <button class="btn-primary" id="loadBtn">Bekleyen Ürünleri Yükle</button>
  </div>

  <div id="status"></div>
  <div id="counter" class="hidden"></div>
  <div id="queue"></div>
  <button id="loadMore" class="btn-secondary hidden">Sonraki 20'yi Göster</button>

<script type="module">
import { pipeline, cos_sim } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0";

const el = {
  repo: document.getElementById("repoInput"),
  branch: document.getElementById("branchInput"),
  token: document.getElementById("tokenInput"),
  remember: document.getElementById("rememberToken"),
  loadBtn: document.getElementById("loadBtn"),
  status: document.getElementById("status"),
  counter: document.getElementById("counter"),
  queue: document.getElementById("queue"),
  loadMore: document.getElementById("loadMore"),
};

const PAGE_SIZE = 20;
const CODE_RE = /\b\d{6,8}\b/;

let reviewItems = [];   // ocr_review.json içeriği (bellekte)
let shownCount = 0;
let clipExtractor = null;

// ---- Token hatırlama ----
const savedToken = localStorage.getItem("bimkod_admin_token");
if (savedToken) { el.token.value = savedToken; el.remember.checked = true; }
el.remember.addEventListener("change", () => {
  if (!el.remember.checked) localStorage.removeItem("bimkod_admin_token");
});

function setStatus(msg) { el.status.textContent = msg; }

function ghHeaders() {
  return {
    "Authorization": `Bearer ${el.token.value.trim()}`,
    "Accept": "application/vnd.github+json",
  };
}

function apiBase() {
  return `https://api.github.com/repos/${el.repo.value.trim()}`;
}

function rawBase() {
  return `https://raw.githubusercontent.com/${el.repo.value.trim()}/${el.branch.value.trim()}`;
}

// ---- GitHub Contents API yardımcıları ----
async function ghGetFile(path) {
  const res = await fetch(`${apiBase()}/contents/${path}?ref=${el.branch.value.trim()}&_=${Date.now()}`, { headers: ghHeaders() });
  if (!res.ok) throw new Error(`${path} okunamadı (${res.status})`);
  const data = await res.json();
  const text = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ""))));
  return { text, sha: data.sha };
}

async function ghPutFile(path, contentStr, sha, message) {
  const b64 = btoa(unescape(encodeURIComponent(contentStr)));
  const res = await fetch(`${apiBase()}/contents/${path}`, {
    method: "PUT",
    headers: { ...ghHeaders(), "Content-Type": "application/json" },
    body: JSON.stringify({ message, content: b64, sha, branch: el.branch.value.trim() }),
  });
  if (!res.ok) throw new Error(`${path} yazılamadı (${res.status}): ${await res.text()}`);
  return res.json();
}

async function ghPutBinaryFile(path, base64Content, message) {
  // Yeni dosya oluşturuyoruz -> sha gerekmez (dosya yoksa)
  const res = await fetch(`${apiBase()}/contents/${path}`, {
    method: "PUT",
    headers: { ...ghHeaders(), "Content-Type": "application/json" },
    body: JSON.stringify({ message, content: base64Content, branch: el.branch.value.trim() }),
  });
  if (!res.ok) throw new Error(`${path} yazılamadı (${res.status}): ${await res.text()}`);
  return res.json();
}

async function fetchImageAsBase64(url) {
  const res = await fetch(url);
  const buf = await res.arrayBuffer();
  let binary = "";
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

// ---- CLIP embedding (görsel arama indeksine eklemek için) ----
async function embedImage(url) {
  if (!clipExtractor) {
    setStatus("Görsel analiz motoru hazırlanıyor (ilk seferde ~30sn)…");
    clipExtractor = await pipeline("image-feature-extraction", "Xenova/clip-vit-base-patch32", { quantized: true });
  }
  const output = await clipExtractor(url, { pooling: "mean", normalize: true });
  return Array.from(output.data);
}

// ---- Ham OCR metninden en olası kod tahminini çıkar (yardımcı, otomatik doldurma için) ----
function guessCode(rawText) {
  const lines = (rawText || "").split("\n");
  let last = null;
  for (const line of lines) {
    const m = CODE_RE.exec(line);
    if (m) last = m[0];
  }
  return last || "";
}
function guessName(item) {
  if (item.name) return item.name;
  const lines = (item.raw_ocr || "").split("\n").filter((l) => l.trim());
  return lines.filter((l) => !CODE_RE.test(l)).join(" ").trim();
}

// ---- Yükleme ----
el.loadBtn.addEventListener("click", async () => {
  if (el.remember.checked) localStorage.setItem("bimkod_admin_token", el.token.value.trim());
  el.loadBtn.disabled = true;
  setStatus("pipeline/ocr_review.json yükleniyor…");
  try {
    const { text } = await ghGetFile("pipeline/ocr_review.json");
    reviewItems = JSON.parse(text);
    shownCount = 0;
    setStatus(`Yüklendi. Toplam bekleyen: ${reviewItems.length}`);
    el.counter.classList.remove("hidden");
    renderMore();
  } catch (err) {
    setStatus("Hata: " + err.message);
  }
  el.loadBtn.disabled = false;
});

el.loadMore.addEventListener("click", renderMore);

function renderMore() {
  const slice = reviewItems.slice(shownCount, shownCount + PAGE_SIZE);
  slice.forEach((item, idx) => renderCard(item, shownCount + idx));
  shownCount += slice.length;
  el.counter.textContent = `${shownCount} / ${reviewItems.length} gösteriliyor`;
  el.loadMore.classList.toggle("hidden", shownCount >= reviewItems.length);
}

function renderCard(item, index) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.index = index;

  const imgUrl = item.review_image ? `${rawBase()}/${item.review_image}` : "";
  const suggestedCode = item.code || guessCode(item.raw_ocr);
  const suggestedName = guessName(item);

  card.innerHTML = `
    ${imgUrl ? `<img src="${imgUrl}" alt="crop" onerror="this.style.opacity=0.15">` : `<div style="width:90px;height:110px;background:var(--bg);border-radius:8px;flex-shrink:0;"></div>`}
    <div class="card-body">
      <div class="raw-ocr">${(item.raw_ocr || "(OCR metni yok)").replace(/</g, "&lt;")}</div>
      <div class="field-row">
        <div>
          <label>Kod</label>
          <input type="text" class="code-input" value="${suggestedCode}">
        </div>
        <div>
          <label>İsim</label>
          <input type="text" class="name-input" value="${suggestedName.replace(/"/g, "&quot;")}">
        </div>
      </div>
      <div class="card-actions">
        <button class="btn-approve">Onayla ve Ekle</button>
        <button class="btn-reject">Reddet</button>
      </div>
      <div class="card-status" style="font-size:12px; margin-top:6px; color:var(--text-soft);"></div>
    </div>
  `;

  card.querySelector(".btn-approve").addEventListener("click", () => approveItem(item, card));
  card.querySelector(".btn-reject").addEventListener("click", () => rejectItem(item, card));

  el.queue.appendChild(card);
}

function cardStatus(card, msg) {
  card.querySelector(".card-status").textContent = msg;
}

// ---- Reddet: sadece ocr_review.json'dan sil ----
async function rejectItem(item, card) {
  card.classList.add("done");
  cardStatus(card, "Siliniyor…");
  try {
    await removeFromReviewQueue(item);
    cardStatus(card, "✅ Reddedildi, kuyruktan silindi.");
  } catch (err) {
    card.classList.remove("done");
    cardStatus(card, "❌ Hata: " + err.message);
  }
}

// ---- Onayla: products.json + embeddings.json + images/ + corrections.csv güncelle, review'dan sil ----
async function approveItem(item, card) {
  const code = card.querySelector(".code-input").value.trim();
  const name = card.querySelector(".name-input").value.trim();
  if (!code || !name) { cardStatus(card, "⚠️ Kod ve isim boş olamaz."); return; }

  card.classList.add("done");
  try {
    const imgUrl = `${rawBase()}/${item.review_image}`;

    cardStatus(card, "Görsel embedding hesaplanıyor…");
    const embedding = await embedImage(imgUrl);

    cardStatus(card, "products.json okunuyor…");
    const { text: productsText, sha: productsSha } = await ghGetFile("data/products.json");
    const products = JSON.parse(productsText);

    cardStatus(card, "embeddings.json okunuyor…");
    const { text: embText, sha: embSha } = await ghGetFile("data/embeddings.json");
    const embData = JSON.parse(embText);

    const embIndex = embData.vectors.length;
    const imageFilename = `${String(embIndex).padStart(6, "0")}.jpg`;

    cardStatus(card, "Görsel images/ klasörüne yükleniyor…");
    const imgBase64 = await fetchImageAsBase64(imgUrl);
    await ghPutBinaryFile(`images/${imageFilename}`, imgBase64, `Admin onayı: ${code} görseli eklendi`);

    embData.vectors.push(embedding);
    products.push({
      code, name,
      price: item.price || null,
      image: `images/${imageFilename}`,
      embIndex,
      confidence: item.confidence || null,
      addedAt: new Date().toISOString(),
      approvedManually: true,
    });

    cardStatus(card, "products.json güncelleniyor…");
    await ghPutFile("data/products.json", JSON.stringify(products, null, 2), productsSha, `Admin onayı: ${code} eklendi`);

    cardStatus(card, "embeddings.json güncelleniyor…");
    await ghPutFile("data/embeddings.json", JSON.stringify(embData), embSha, `Admin onayı: ${code} embedding eklendi`);

    cardStatus(card, "corrections.csv güncelleniyor…");
    await appendCorrection(code, name);

    cardStatus(card, "Kuyruktan siliniyor…");
    await removeFromReviewQueue(item);

    cardStatus(card, "✅ Eklendi ve yayında!");
  } catch (err) {
    card.classList.remove("done");
    cardStatus(card, "❌ Hata: " + err.message);
  }
}

async function appendCorrection(code, name) {
  let text = "code,name\n", sha = null;
  try {
    const f = await ghGetFile("pipeline/catalog_source/corrections.csv");
    text = f.text; sha = f.sha;
  } catch { /* dosya yoksa sıfırdan oluşturulacak */ }

  if (!text.includes(`\n${code},`) && !text.startsWith(`${code},`)) {
    const csvSafeName = name.includes(",") ? `"${name}"` : name;
    text = text.replace(/\n?$/, "") + `\n${code},${csvSafeName}\n`;
  }
  if (sha) {
    await ghPutFile("pipeline/catalog_source/corrections.csv", text, sha, `Admin: ${code} düzeltmesi eklendi`);
  } else {
    await ghPutBinaryFile("pipeline/catalog_source/corrections.csv", btoa(unescape(encodeURIComponent(text))), `Admin: corrections.csv oluşturuldu`);
  }
}

async function removeFromReviewQueue(item) {
  const { text, sha } = await ghGetFile("pipeline/ocr_review.json");
  const current = JSON.parse(text);
  const filtered = current.filter((x) => {
    if (item.review_image && x.review_image) return x.review_image !== item.review_image;
    return !(x.full_crop === item.full_crop && x.source_flyer === item.source_flyer);
  });
  await ghPutFile("pipeline/ocr_review.json", JSON.stringify(filtered, null, 2), sha, "Admin: onaylanan/reddedilen ürün kuyruktan silindi");
  // bellekteki listeden de çıkar
  reviewItems = reviewItems.filter((x) => x !== item);
}
</script>
</body>
</html>
