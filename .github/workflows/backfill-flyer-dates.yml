name: Eski Afişlerin Satış Tarihini Doldur

# Elle çalıştır (Actions -> bu workflow -> Run workflow). Her çalışmada en fazla "limit"
# afişi Telegram'dan tekrar indirip üzerindeki satış tarihini OCR ile okur ve
# data/flyer_dates.json dosyasına yazar. Bitene kadar tekrar çalıştırın
# (log'da "tarihi olmayan: N" sayısı sıfıra inince tamamdır).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Bu çalışmada işlenecek en fazla afiş sayısı"
        default: "300"
      retry_empty:
        description: "Daha önce tarih bulunamayanları da yeniden dene (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: bimkod-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar (sadece gerekenler, torch yok)
        run: |
          pip install telethon==1.36.0 pillow==10.4.0 pytesseract==0.3.13
          sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr

      - name: Tarihleri oku
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python pipeline/flyer_dates.py --backfill --limit "${{ github.event.inputs.limit }}" \
            $([ "${{ github.event.inputs.retry_empty }}" = "true" ] && echo "--retry-empty")

      - name: Commit
        run: |
          git config user.name "bimkod-bot"
          git config user.email "actions@github.com"
          git add data/flyer_dates.json
          git diff --cached --quiet && echo "Değişiklik yok" || git commit -m "Afiş satış tarihleri güncellendi"
          git pull --rebase
          git push
