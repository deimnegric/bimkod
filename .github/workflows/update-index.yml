name: BİMKOD Index Güncelle

on:
  schedule:
    - cron: "0 5,13,21 * * *"   # günde 3 kez: TR saatiyle 08:00 / 16:00 / 00:00 (UTC 05:00/13:00/21:00)
  workflow_dispatch: {}          # manuel tetikleme butonu

# NOT: cron her gün çalışıyor (sadece Pzt/Per/Cmt'e kısıtlamadık) çünkü
# gün+saat birleşimini UTC'ye çevirirken 00:00 TR bir önceki UTC gününe
# denk geldiği için gün kısıtlaması karmaşıklaşıyor; repo public olduğu
# için günde 3 boş kontrol de maliyetsiz, sorun yaratmıyor.

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Bağımlılıkları yükle
        run: pip install -r pipeline/requirements.txt

      - name: Tesseract OCR kur (Türkçe dil paketiyle)
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-tur

      - name: YOLO ağırlığını indir
        # Ağırlık dosyası (best.pt) bir GitHub Release asset'i olarak yüklenmişse indir.
        # Yoksa pipeline/model/best.pt olarak doğrudan repoya commit et ve bu adımı sil.
        run: |
          mkdir -p pipeline/model
          if [ ! -f pipeline/model/best.pt ]; then
            curl -L -o pipeline/model/best.pt \
              "https://github.com/${{ github.repository }}/releases/download/model-v1/best.pt"
          fi

      - name: 1) Telegram'dan yeni flyer'ları çek
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python pipeline/scrape_telegram.py

      - name: 2) YOLO ile ürün karesi tespiti
        run: python pipeline/detect_products.py

      - name: 3) OCR ile isim/kod/fiyat çıkar
        run: python pipeline/ocr_extract.py

      - name: 4) CLIP embedding çıkar
        run: python pipeline/embed_products.py

      - name: 5) Veri setini birleştir
        run: python pipeline/build_data.py

      - name: Değişiklikleri commit'le
        run: |
          git config user.name "bimkod-bot"
          git config user.email "actions@github.com"
          mkdir -p data images review
          git add data/ images/ review/ pipeline/scrape_state.json pipeline/ocr_review.json pipeline/catalog_source/corrections.csv pipeline/rescan_queue.json
          git diff --cached --quiet && echo "Değişiklik yok" || git commit -m "Otomatik veri güncelleme $(date -u +%Y-%m-%d)"
          git push
